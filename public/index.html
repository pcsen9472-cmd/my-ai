<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Powerhouse - Free Studio & Trading Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen p-6">
    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">AI Powerhouse Hub</h1>
            <p class="text-slate-400 mt-2">Aapka All-in-One Free AI Video, Music & Trading Assistant</p>
        </header>

        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Select Tool Category:</label>
                <select id="promptType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500">
                    <option value="video">🎬 AI Video & Animation Prompt</option>
                    <option value="music">🎵 Bollywood/Hollywood Music Generator</option>
                    <option value="trading">📈 Share Market & IPO Tip Analyzer</option>
                    <option value="general">🤖 General AI Assistant & Website Builder</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Aapko kya banana ya janna hai?</label>
                <textarea id="userPrompt" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="Yahan apna idea likhein..."></textarea>
            </div>

            <button onclick="generateAI()" class="w-full bg-gradient-to-r from-purple-500 to-pink-600 font-bold py-3 rounded-lg hover:opacity-90 transition">
                🚀 Generate Live Output
            </button>
        </div>

        <div id="outputSection" class="mt-8 bg-slate-800 p-6 rounded-2xl border border-slate-750 hidden">
            <h2 class="text-lg font-semibold text-purple-400 mb-2">Generated Output:</h2>
            <div id="resultText" class="text-slate-200 bg-slate-900 p-4 rounded-lg border border-slate-700"></div>
        </div>
    </div>

    <script>
        async function generateAI() {
            const promptType = document.getElementById('promptType').value;
            const userPrompt = document.getElementById('userPrompt').value;
            const outputSection = document.getElementById('outputSection');
            const resultText = document.getElementById('resultText');

            if (!userPrompt.trim()) {
                alert('Pehle kuch text toh likhiye!');
                return;
            }

            resultText.innerText = 'Generating intelligence... Please wait...';
            outputSection.classList.remove('hidden');

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ promptType, userPrompt })
                });
                const data = await response.json();
                if (data.success) {
                    resultText.innerText = data.result;
                } else {
                    resultText.innerText = 'Kuch error aa gaya. Dobara try karein.';
                }
            } catch (err) {
                resultText.innerText = 'Connection error! Server check karein.';
            }
        }
    </script>
</body>
</html>
